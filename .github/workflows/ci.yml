name: CI

# Deliberately NOT triggered by pushes: no APK is built unless a pull request is opened or someone starts it by hand.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Look for credentials, keys and server addresses
        run: bash scripts/check-secrets.sh

  build-debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: health-connect-gate-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      # --continue: run both even if one fails, so a PR shows every problem at once, not just the first.
      # lintDebug is checked against app/lint-baseline.xml (today's known findings, see ROADMAP.md); only a NEW
      # error or warning fails it.
      - name: Unit tests and lint
        run: ./gradlew --no-daemon --continue :app:testDebugUnitTest :app:lintDebug
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: health-connect-gate-test-and-lint-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 7

  server-tests:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s server/tests
      - name: End-to-end smoke test (JSONL layout, then SQLite)
        run: |
          python server/tests/smoke_write.py
          HEALTH_RECEIVER_STORE=sqlite python server/tests/smoke_write.py

  docker-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate the compose file
        run: HEALTH_RECEIVER_AUTH_URL=http://auth.invalid/ docker compose -f server/compose.yaml config -q
      - name: Build the image
        run: docker build -t health-connect-gate-receiver server
      - name: Runs as an unprivileged user
        run: test "$(docker run --rm --entrypoint id health-connect-gate-receiver -u)" != 0
      - name: Start it and check the probes and the fail-closed default
        run: |
          docker run -d --name receiver --read-only --cap-drop ALL --tmpfs /run/receiver:uid=10001,gid=10001,mode=0700 --tmpfs /tmp \
            -p 127.0.0.1:9120:9120 health-connect-gate-receiver
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:9120/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:9120/api/health/config | grep -q accepts_gzip
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9120/api/health/sync/status)" = 401
          docker exec receiver python3 /app/receiver.py backup /data/backups/
          docker logs receiver
