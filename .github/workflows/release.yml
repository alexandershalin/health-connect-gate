name: Release

# Pushing a tag such as v0.1 builds a signed APK and publishes it as a GitHub Release.
# Starting the workflow by hand only builds the APK and keeps it as a workflow artifact (no release is created).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # needed to create the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Check the repository for credentials and server addresses
        run: bash scripts/check-secrets.sh

      - name: Read the version from Gradle
        id: ver
        run: |
          name=$(sed -nE 's/.*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -1)
          code=$(sed -nE 's/.*versionCode = ([0-9]+).*/\1/p' app/build.gradle.kts | head -1)
          [ -n "$name" ] && [ -n "$code" ] || { echo "::error::versionName/versionCode not found"; exit 1; }
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: The tag must match versionName
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
          NAME: ${{ steps.ver.outputs.name }}
        run: |
          [ "${TAG#v}" = "$NAME" ] || { echo "::error::tag $TAG does not match versionName $NAME"; exit 1; }

      - name: Prepare the signing key
        env:
          KEYSTORE_B64: ${{ secrets.GATE_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_B64" ] || { echo "::error::signing secrets are not configured"; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/gate-release.p12"
          echo "GATE_KEYSTORE_FILE=$RUNNER_TEMP/gate-release.p12" >> "$GITHUB_ENV"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build the signed release APK
        env:
          GATE_KEYSTORE_PASSWORD: ${{ secrets.GATE_KEYSTORE_PASSWORD }}
          GATE_KEY_ALIAS: ${{ secrets.GATE_KEY_ALIAS }}
          GATE_KEY_PASSWORD: ${{ secrets.GATE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Verify the APK (signature, package, version)
        id: apk
        env:
          NAME: ${{ steps.ver.outputs.name }}
          CODE: ${{ steps.ver.outputs.code }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          SRC=app/build/outputs/apk/release/app-release.apk
          OUT="HealthConnectGate-$NAME.apk"
          cp "$SRC" "$OUT"
          "$BT/apksigner" verify --print-certs "$OUT" | tee certs.txt
          if grep -q "CN=Android Debug" certs.txt; then echo "::error::APK is signed with a debug key"; exit 1; fi
          "$BT/aapt2" dump badging "$OUT" | head -1 | tee badging.txt
          grep -q "package: name='com.bishop.healthconnectgate' versionCode='$CODE' versionName='$NAME'" badging.txt \
            || { echo "::error::unexpected package or version inside the APK"; exit 1; }
          sha256sum "$OUT" > "$OUT.sha256"
          FP=$(grep -m1 'certificate SHA-256 digest' certs.txt | sed 's/.*: //')
          printf 'Signed APK for Android 8.0+ (Health Connect required).\n\nSigning certificate SHA-256: `%s`\n' "$FP" > release-notes.md
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          NAME: ${{ steps.ver.outputs.name }}
          FILE: ${{ steps.apk.outputs.file }}
        run: |
          flags=""
          case "$NAME" in 0.*) flags="--prerelease" ;; esac
          gh release create "$TAG" "$FILE" "$FILE.sha256" --verify-tag $flags \
            --title "Health Connect Gate $NAME" --notes-file release-notes.md

      - name: Keep the APK as a workflow artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: health-connect-gate-release
          path: |
            HealthConnectGate-*.apk
            HealthConnectGate-*.apk.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Remove the signing key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/gate-release.p12"
